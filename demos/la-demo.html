<script>
(function () {
    'use strict';
    var CFG = {"build": "8c14b26535", "talks": 4, "treatments": ["win", "lose"], "n": 8};          // the build, the number of slides, the treatments and the games (for reference)
    window.__LA_SHOWCASE = CFG;
    function $(id) { return document.getElementById(id); }
    function fail(t) { var d = $('ld'); d.textContent = t; d.className = 'ld bad'; }
    var ok = !!(typeof window.DecompressionStream === 'function' && window.URLSearchParams && window.Blob &&
                window.Response && window.URL && typeof URL.createObjectURL === 'function');
    if (!ok) {
        fail('This browser is too old for the demo. Please open the link in a current Chrome, Edge, Firefox or Safari.');
        return;
    }

    // the bundle: the pages and their files as JSON, gzipped, in base64
    function open() {
        var b = atob($('la-bundle').textContent.trim()), u = new Uint8Array(b.length);
        for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
        var ds = new DecompressionStream('gzip');
        return new Response(new Blob([u]).stream().pipeThrough(ds)).text()
            .then(function (txt) { return JSON.parse(txt); });
    }

    // which page: ?v=talk&n=1.., ?v=demo&t=win|lose, ?v=game&t=..&k=1.., ?v=end&t=..; anything else: the first page
    function pageKey(B) {
        var p = new URLSearchParams(window.location.search), v = p.get('v') || 'talk', t = p.get('t') || '';
        var key = v === 'talk' ? 'talk/' + (p.get('n') || '1') :
                  (v === 'demo' || v === 'end') ? v + '/' + t :
                  v === 'game' ? 'game/' + t + '/' + (p.get('k') || '') : '';
        return Object.prototype.hasOwnProperty.call(B.pages, key) ? key : 'talk/1';
    }
    function show(B) {
        var key = pageKey(B), urls = {};
        // opened with no page named (or an unknown or old link, such as ?v=lock): the address becomes the first page's
        if (key === 'talk/1' && new URLSearchParams(window.location.search).get('v') !== 'talk') {
            try { window.history.replaceState(null, '', '?v=talk&n=1'); } catch (e) { /* the address stays */ }
        }
        var html = B.pages[key].replace(/@asset:([\w.\/-]+)(?:\?[\w=.&-]*)?/g, function (m, path) {
            var a = B.assets[path];
            if (!a) return m;
            if (!urls[path]) urls[path] = URL.createObjectURL(new Blob([a.text], { type: a.type }));
            return urls[path];
        });
        document.open();
        document.write(html);
        document.close();
    }

    Promise.resolve().then(open).then(show).catch(function (err) {     // a damaged bundle (atob throws) ends here too
        fail('The demo could not be opened (' + (err && err.name || 'error') + '). Please reload the page.');
    });
})();
</script>
