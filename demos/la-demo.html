<!-- la_showcase (build.py writes this file from src/index.template.html): a password screen, then the pages, which are
     in the bundle at the end of this file, encrypted. Nothing on this screen says what the demo is about. -->
<style>
  :root { --bg-outer: #5E7282; --bg: #E8E0D4; --text: #1A2422; --muted: #5E7573; --teal: #1B6B69; --header: #0F1D26;
          --header-text: #F0EDE8; --border: #CDD1D6; --bad: #9B2C2C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg-outer); color: var(--text); min-height: 100vh;
         font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .lk-page { max-width: 906px; min-height: 100vh; margin: 0 auto; background: var(--bg);
             box-shadow: 0 0 50px rgba(0, 0, 0, 0.3); }
  .lk-head { margin: 0; padding: 12px 22px; background: var(--header); color: var(--header-text);
             font-family: Georgia, 'Times New Roman', serif; font-size: 1.15rem; font-weight: 600; }
  .lk-card { max-width: 420px; margin: 3rem auto 0; padding: 24px 26px; background: #fff; border: 1px solid var(--border);
             border-radius: 18px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
  .lk-card p { margin: 0 0 1rem; line-height: 1.5; }
  .lk-card label { display: block; font-weight: 600; margin-bottom: 6px; }
  .lk-card input { width: 100%; min-height: 46px; padding: 10px 14px; font-size: 1rem; border: 1.5px solid var(--border);
                   border-radius: 12px; }
  .lk-card input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(27, 107, 105, 0.2); }
  .lk-card button { margin-top: 14px; min-height: 46px; padding: 11px 26px; border: 0; border-radius: 999px;
                    background: linear-gradient(135deg, var(--teal), #0E4A48); color: #fff; font-size: 1rem;
                    font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(14, 74, 72, 0.25); }
  .lk-card button:disabled { opacity: 0.6; cursor: default; }
  .lk-msg { min-height: 1.5em; margin: 12px 0 0 !important; color: var(--muted); }
  .lk-msg.bad { color: var(--bad); }
  .lk-wait { padding: 3rem 1rem; text-align: center; color: var(--header-text); }
  @media (max-width: 575px) { .lk-head { padding: 9px 14px; font-size: 1rem; } .lk-card { margin: 1.5rem 10px 0; padding: 18px; } }
</style>
</head>
<body>
<div class="lk-wait" id="lk-wait">Loading&hellip;</div>
<div class="lk-page" id="lk" hidden>
  <h1 class="lk-head">Research demo</h1>
  <div class="lk-card">
    <form id="lk-form" autocomplete="off" novalidate>
      <p>This demo is password-protected.</p>
      <label for="lk-pw">Password</label>
      <input id="lk-pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <button type="submit" id="lk-go">Open</button>
      <p class="lk-msg" id="lk-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

    function show(B) {
        var key = pageKey(B), urls = {};
        // opened as ?v=lock (or an unknown link): the address becomes the first page's, so that a reload keeps the key
        if (key === 'talk/1' && new URLSearchParams(window.location.search).get('v') !== 'talk') {
            try { window.history.replaceState(null, '', '?v=talk&n=1'); } catch (e) { /* the address stays */ }
        }
        var html = B.pages[key].replace(/@asset:([\w.\/-]+)(?:\?[\w=.&-]*)?/g, function (m, path) {
            var a = B.assets[path];
            if (!a) return m;
            if (!urls[path]) urls[path] = URL.createObjectURL(new Blob([a.text], { type: a.type }));
            return urls[path];
        });
        document.open();
        document.write(html);
        document.close();
    }

    if (new URLSearchParams(window.location.search).get('v') === 'lock') drop(KEY);
    var kept = get(KEY);
    if (kept) {
        crypto.subtle.importKey('raw', b64d(kept), { name: 'AES-GCM' }, false, ['decrypt'])
            .then(open).then(show)
            .catch(function () { drop(KEY); lock(''); });
    } else {
        lock('');
    }

    $('lk-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var pw = $('lk-pw').value;
        if (!pw) { msg('Please enter the password.', true); return; }
        $('lk-pw').disabled = true; $('lk-go').disabled = true;
        msg('Opening…');
        var key;
        crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey'])
            .then(function (base) {
                return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(CFG.salt), iterations: CFG.iter, hash: 'SHA-256' },
                                               base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
            })
            .then(function (k) { key = k; return open(k); })
            .then(function (B) {
                return crypto.subtle.exportKey('raw', key).then(function (raw) { put(KEY, b64e(raw)); show(B); });
            })
            .catch(function (err) {
                var wrong = err && err.name === 'OperationError';
                lock(wrong ? 'That password did not work. Please try again.' : 'The demo could not be opened (' +
                     (err && err.name || 'error') + ').', true);
                $('lk-pw').select();
            });
    });
})();
</script>
</body>
</html>
